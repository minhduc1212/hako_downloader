# Configuration for Hako / Docln Crawler System
app:
  name: "Hako Crawler System"
  version: "2.0.0"
  data_dir: "data"
  output_dir: "output"
  log_dir: "logs"

database:
  db_path: "data/hako.db"
  wal_mode: true
  busy_timeout_ms: 30000

crawler:
  base_url: "https://docln.sbs"
  user_data_dir: "./hako_session"
  headless: true
  num_workers: 3
  
  # Adaptive Rate Limiting (High-precision dynamic auto-pacing)
  max_rps: 0.95
  min_rps: 0.4
  chapter_delay_min: 0.05
  chapter_delay_max: 0.15
  page_delay_min: 0.3
  page_delay_max: 0.8
  random_jitter: true
  
  # 429 & Backoff handling (Thời gian nghỉ khi gặp 429)
  backoff_429_min: 20.0
  backoff_429_max: 40.0
  
  # Timeouts & Retries
  goto_timeout_ms: 60000
  selector_timeout_ms: 20000
  max_retries: 3
  retry_backoff_base: 2.0
  
  # Post-retry (Dead Letter Queue)
  enable_post_retry: true
  post_retry_max_attempts: 3
  post_retry_delay_sec: 5.0
  
  # Resource blocking for speed
  block_resources: true

media:
  download_images: true
  download_covers: true
  download_chapter_illustrations: true
  cover_dir: "output/media/covers"
  chapter_img_dir: "output/media/chapters"
  max_image_workers: 5
  image_timeout_sec: 30

proxy:
  enabled: false
  proxy_type: "socks5" # socks5, http, tor, list
  proxy_url: "socks5://127.0.0.1:9050" # Tor default: socks5://127.0.0.1:9050
  proxy_list_file: "config/proxies.txt"
  rotate_interval_requests: 25

daily:
  check_interval_hours: 6
  latest_updates_max_pages: 5
  auto_retry_failed: true
  export_txt_on_complete: true
  feed_url_template: "https://docln.sbs/the-loai/slice-of-life?truyendich=1&sangtac=1&convert=1&dangtienhanh=1&tamngung=1&hoanthanh=1&sapxep=capnhat&page={page}"

export:
  output_dir: "output/novels"   # Thư mục lưu file truyện khi xuất (manual export)

logging:
  level: "INFO"
  rich_console: true
  log_file: "logs/crawler.log"
  max_bytes: 10485760 # 10MB
  backup_count: 5
